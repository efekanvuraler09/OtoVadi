<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Tema flaşını önler: React yüklenmeden önce, ilk boyamadan ÖNCE çalışır.
      Öncelik: kullanıcının kaydettiği tercih (zustand persist: "theme-storage"); kayıt yoksa HER ZAMAN koyu (işletim sistemi teması dikkate alınmaz).
      Renkler src/index.css'teki --color-void değerleriyle aynı olmalı.
    -->
    <style>
      html { background-color: #ffffff; color-scheme: light; }
      html.dark { background-color: #000000; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          var stored = JSON.parse(localStorage.getItem('theme-storage') || 'null');
          theme = stored && stored.state ? stored.state.theme : null;
          var locale = JSON.parse(localStorage.getItem('otovadi-locale') || 'null');
          if (locale && locale.state && /^(tr|en|de)$/.test(locale.state.locale)) root.lang = locale.state.locale;
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        if (theme === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');

        // P1: Ana sayfada hero posteri (LCP) JS paketini beklemeden inmeye başlar. Diğer rotalarda indirilmez.
        if (location.pathname === '/') {
          var poster = document.createElement('link');
          poster.rel = 'preload';
          poster.as = 'image';
          poster.href = '/hero-poster.webp';
          poster.type = 'image/webp';
          poster.setAttribute('fetchpriority', 'high');
          document.head.appendChild(poster);
        }
      })();
    </script>

    <title>OtoVadi | Dijital Showroom</title>
    <!-- Varsayılan SEO etiketleri. Rota bazında hooks/usePageMeta günceller; değerler src/lib/seo.ts ve api/og-meta.ts ile aynı. -->
    <meta
      name="description"
      content="OtoVadi dijital showroom: araçları sinematik detay sayfalarında keşfedin, yan yana karşılaştırın, yapay zekâ destekli Akıllı Keşif ile size en uygun modeli bulun ve test sürüşü randevusu alın."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://otovadi.vercel.app/" />

    <!-- İkonlar: SVG favicon işletim sistemi temasına göre renk değiştirir (açık sekmede siyah, koyu sekmede beyaz) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="OtoVadi" />
    <meta name="apple-mobile-web-app-title" content="OtoVadi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn). Araç sayfaları için botlara api/og-meta.ts araca özel kart döner. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OtoVadi" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:url" content="https://otovadi.vercel.app/" />
    <meta property="og:title" content="OtoVadi | Dijital Showroom" />
    <meta
      property="og:description"
      content="OtoVadi dijital showroom: araçları sinematik detay sayfalarında keşfedin, yan yana karşılaştırın, yapay zekâ destekli Akıllı Keşif ile size en uygun modeli bulun ve test sürüşü randevusu alın."
    />
    <meta property="og:image" content="https://otovadi.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OtoVadi logosu: çember içinde V monogramı ve OTOVADİ yazısı, siyah zemin üzerinde" />

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OtoVadi | Dijital Showroom" />
    <meta
      name="twitter:description"
      content="OtoVadi dijital showroom: araçları sinematik detay sayfalarında keşfedin, yan yana karşılaştırın, yapay zekâ destekli Akıllı Keşif ile size en uygun modeli bulun ve test sürüşü randevusu alın."
    />
    <meta name="twitter:image" content="https://otovadi.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="OtoVadi logosu: çember içinde V monogramı ve OTOVADİ yazısı, siyah zemin üzerinde" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
