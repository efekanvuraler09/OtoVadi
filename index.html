<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23000000"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Tema flaşını önler: React yüklenmeden önce, ilk boyamadan ÖNCE çalışır.
      Öncelik: kullanıcının kaydettiği tercih (zustand persist: "theme-storage") → işletim sistemi tercihi → koyu.
      Renkler src/index.css'teki --color-void değerleriyle aynı olmalı.
    -->
    <style>
      html { background-color: #ffffff; color-scheme: light; }
      html.dark { background-color: #000000; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          var stored = JSON.parse(localStorage.getItem('theme-storage') || 'null');
          theme = stored && stored.state ? stored.state.theme : null;
          var locale = JSON.parse(localStorage.getItem('otovadi-locale') || 'null');
          if (locale && locale.state && /^(tr|en|de)$/.test(locale.state.locale)) root.lang = locale.state.locale;
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (theme === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://otovadi.vercel.app/" />
    <meta property="og:title" content="OtoVadi | Dijital Showroom" />
    <meta property="og:image" content="https://otovadi.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://otovadi.vercel.app/og-image.jpg" />
    <meta itemprop="image" content="https://otovadi.vercel.app/og-image.jpg" />
    <link rel="image_src" href="https://otovadi.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OtoVadi | Dijital Showroom" />
    <meta name="twitter:image" content="https://otovadi.vercel.app/og-image.jpg" />

    <title>OtoVadi | Dijital Showroom</title>
